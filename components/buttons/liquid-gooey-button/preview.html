<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图文展示 - 预览</title>
  <style>
    body { margin: 0; padding: 0; background: #fbf9f4; font-family: 'Inter', sans-serif; color: #191b1f; }
    .showcase { max-width: 860px; margin: 0 auto; padding: 3rem 1.5rem; display: flex; gap: 2rem; align-items: center; flex-direction: row-reverse; }
    .showcase-img { width: 45%; aspect-ratio: 4/3; background: #1D9E75; border-radius: 12px; box-shadow: 8px 8px 0 rgba(0,0,0,0.12); }
    .showcase-text { flex: 1; }
    .showcase-text h2 { font-size: 1.8rem; margin: 0 0 0.8rem; }
    .showcase-text p { font-size: 1.05rem; line-height: 1.9; color: #444; margin: 0; }
  </style>
</head>
<body>
  <div class="showcase">
    <div class="showcase-img"></div>
    <div class="showcase-text">
      <h2>内容输入区域</h2>
      <p>这里是内容输入区域，可以替换成任意文字。这张纯色图片之后可以换成你的截图或照片。</p>
    </div>
  </div>
</body>
</html>
