<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>动态文字按钮 | 我的主页</title>
  <!-- PrismJS for Syntax Highlighting -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script type="module" crossorigin src="../../../assets/modulepreload-polyfill-Dezn_h7o.js"></script>
  <script type="module" crossorigin src="../../../assets/rolldown-runtime-DK3Fl9T5.js"></script>
  <script type="module" crossorigin src="../../../assets/gsap-D_956-p2.js"></script>
  <script type="module" crossorigin src="../../../assets/viewer-C855CnrK.js"></script>
  <link rel="stylesheet" crossorigin href="../../../assets/style-DG8Jl2zA.css">
</head>
<body>
  <div id="app">
    <a href="../../../" class="back-btn">← 返回笔记本</a>
    
    <div class="viewer-layout">
      <!-- 实时预览 -->
      <div class="preview-section">
        <div class="preview-header">
          <h2>标题</h2>
        </div>
        <iframe class="preview-iframe" src="./preview.html"></iframe>
        
        <!-- Dynamic Settings Controls -->
        <div class="content-input-placeholder" style="border: 3px dashed var(--text-ink); border-radius: 12px; padding: 1rem; font-family: var(--font-sketch); font-size: 1.3rem; color: var(--text-ink); text-align: center; background: rgba(255,255,255,0.5); box-shadow: 3px 3px 0 rgba(0,0,0,0.85);">内容输入区域</div>
<div class="preview-controls" style="display:none;">
          <div class="control-group">
            <label>错位延迟： <span id="valStagger">0.02s</span></label>
            <input type="range" id="slideStagger" min="0.005" max="0.1" step="0.005" value="0.02">
          </div>
          <div class="control-group">
            <label>滚动时长： <span id="valDuration">0.45s</span></label>
            <input type="range" id="slideDuration" min="0.2" max="1.5" step="0.05" value="0.45">
          </div>
          <div class="control-group">
            <label>圆角： <span id="valRadius">50px</span></label>
            <input type="range" id="slideRadius" min="0" max="50" step="1" value="50">
          </div>
          <div class="control-group">
            <label>主题预设</label>
            <div class="theme-toggles">
              <button class="theme-toggle-btn active" data-theme="dark">深色</button>
              <button class="theme-toggle-btn" data-theme="light">浅色</button>
              <button class="theme-toggle-btn" data-theme="accent">强调色</button>
            </div>
          </div>
          <div class="control-group">
            <label>自定义颜色</label>
            <div class="color-pickers">
              <div class="color-picker-item">
                <span class="color-label">按钮背景</span>
                <div style="display: flex; align-items: center; gap: 6px;">
                  <input type="color" id="colorBg" value="#ffffff">
                  <label style="font-size: 0.75rem; display: flex; align-items: center; gap: 2px; cursor: pointer; white-space: nowrap;">
                    <input type="checkbox" id="checkTransparentBg" checked> Transp.
                  </label>
                </div>
              </div>
              <div class="color-picker-item">
                <span class="color-label">文字</span>
                <input type="color" id="colorText" value="#111111">
              </div>
              <div class="color-picker-item">
                <span class="color-label">边框</span>
                <input type="color" id="colorBorder" value="#111111">
              </div>
              <div class="color-picker-item">
                <span class="color-label">悬停背景</span>
                <input type="color" id="colorHoverBg" value="#ea4aaa">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Code Viewer -->
      <div class="code-section">
        <div class="code-tabs">
          <div class="code-tab active" data-target="html">内容1</div>
          <div class="code-tab" data-target="css">内容2</div>
          <div class="code-tab" data-target="js">内容3</div>
          <div style="flex:1"></div>
          <a id="gitRepoBtn" href="#" class="github-repo-btn" title="自定义链接" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg></a>
          <button class="copy-btn" id="copyBtn">复制代码</button>
        </div>
        <pre class="code-content"><code id="codeBlock" class="language-html">加载中...</code></pre>
        <div class="markdown-content" id="markdownContainer" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
</body>
</html>
